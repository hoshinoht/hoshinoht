    id: forest-link-protocol
    impact:
      - Improved short-range mesh throughput 4.3x (8 KB/s BLE → 34 KB/s ESP-NOW)
      - Transferred 3 MB over 3 hops in ~2 minutes, beating the <20 minute target by ~10x
      - Achieved 24-30 KB/s end-to-end throughput, >95% PDR over 3 hops, and <15 s route convergence
    name: Forest Link Protocol (FLP)
    period: Jan 2026 – Apr 2026
    repo: hoshinoht/forest-link-protocol
    responsibilities:
      - Re-architected FLP from BLE to ESP-NOW + LoRa with DSDV/ETX routing and adaptive LoRa spreading factors
      - Implemented Selective Repeat ARQ, XOR FEC, multi-exit striping, and PSRAM/SD buffering for reliable transfer
      - Built Go cloud backend with Mosquitto, Docker, Cloudflare Tunnel, and MQTT/WSS telemetry-control
      - Built LVGL 9 OLED UI, cloud-to-node messaging, and Unity regression tests for ESP-NOW/MQTT workloads
    summary: >-
      Hybrid ESP-NOW + LoRa mesh protocol for resilient forest IoT deployments,
      with multi-exit file transfer, cloud telemetry, and remote command routing
    tech_stack:
      frameworks:
