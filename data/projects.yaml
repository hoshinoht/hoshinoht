    id: aerial-scene-recognition
    impact:
      - >-
        Champion, Dell Technologies Innovation Awards for Machine Learning 2026
        (Team 12, with SIT); selected for Dell InnovateFest 2026 finals
      - >-
        Winning artifact ships at 27.96 MiB INT8 / 18.7 MiB on the wire with
        macro-F1 1.000 on the 400-image held-out set — 5.4x smaller than the
        FP32 export with zero accuracy lost
      - >-
        Custom HETMCL-lite hybrid transformer reached macro-F1 1.000 after INT8
        at 12.09 MiB — the smallest perfect-score model and one of the two
        finalists for the shipped artifact
      - >-
        Swin-Tiny + LoRA reached 99.25% held-out accuracy after INT8 with a
        2.3 MB adapter; FocalNet-Tiny INT8 held 0.995 macro-F1 at 27.6 MB and
        47 ms CPU latency (from 105.7 MB / 90 ms)
    name: Aerial Scene Recognition at the Edge of the Link
    period: Jun 2026 – Jul 2026
    repo: hoshinoht/CSC3109_Project
    responsibilities:
      - >-
        Designed and trained HETMCL-lite, a custom hybrid CNN-transformer for
        remote-sensing scenes: ResNet18 feature pyramid with high-frequency
        enhancement transformer modules and multi-layer context alignment
        attention, exported to ONNX INT8 QDQ
      - >-
        Led the vision-transformer arm of a nine-model benchmark: Swin-Tiny +
        LoRA, DINOv2 + LoRA, and FocalNet-Tiny, each judged on its deployed
        ONNX INT8 QDQ export rather than its training checkpoint
      - >-
        Ran cross-model analysis: FP32 vs INT8 fidelity, cross-source OOD
        evaluation on NWPU-RESISC45 (FocalNet 0.87 to 0.83 macro-F1 under
        INT8), confusion and confidence-margin analysis feeding final model
        selection
      - >-
        Co-built the InnovateFest selection pitch deck with Lucas Lee (HTML to
        PPTX build pipeline), framing the work as constrained-link model
        delivery
    summary: >-
      Edge-deliverable aerial scene classifier (PatternNet, 4 transport
      classes) benchmarked across nine architectures on their quantised
      artifacts, framed as re-tasking satellite and drone vision over a
      3-5 Mbps uplink
    tech_stack:
      frameworks:
        - PyTorch
        - timm
        - ONNX Runtime
        - FastAPI
        - React
      infrastructure:
        - Docker
        - ONNX Runtime Web
      languages:
        - Python
        - TypeScript
      patterns:
        - Hybrid CNN-Transformer
        - LoRA Fine-Tuning
        - Post-Training INT8 Quantization (QDQ)
        - Edge Inference
        - Cross-Source OOD Evaluation
      tools:
        - Swin Transformer
        - DINOv2
        - FocalNet
        - SAM 3
